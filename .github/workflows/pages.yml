name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/github-pages-roku-docs-ie78cb
      - claude/web-pages-repo-push-cby8qx
      - main
  workflow_dispatch:

# Least privilege needed for the Pages deploy to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # enablement turns Pages on via the API on the first run, so the
      # repository needs no manual Settings step.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static HTML, so the repo root is the artifact as-is.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
